name: Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check documentation links
        run: |
          python -m unittest tools.test_check_markdown_links
          python tools/check_markdown_links.py .

  manuscript-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build manuscript shell in the declared clean environment
        run: ./manuscript/build-clean.sh
      - name: Test the public control, build, and release-check seams
        run: |
          image_name="$(cat manuscript/environment/image-tag.txt)"
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            --entrypoint python3 \
            "$image_name" \
            -m unittest \
            manuscript.tests.test_controls \
            manuscript.tests.test_release_check \
            manuscript.tests.test_manuscript_build
      - name: Confirm that the draft cannot be mistaken for a submission candidate
        run: |
          set +e
          python3 manuscript/check_release.py
          release_status=$?
          set -e
          if [ "$release_status" -ne 1 ]; then
            echo "Expected the draft shell to fail closed with status 1."
            exit 1
          fi
