name: Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run reproducibility checks
        run: |
          python reproducibility/checks/check_pathwise_dca_dominance.py
          python reproducibility/checks/check_corrected_out_quasi_gini_homogeneity.py
          python reproducibility/checks/check_epsilon_dca_safety_guardrail.py
          python reproducibility/checks/check_guarded_corrected_mean_smartdca.py
          python reproducibility/checks/check_two_purchase_dca_win_loss_boundary.py
          python reproducibility/checks/check_three_purchase_corrected_mean_effect.py

  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install knowledge tooling
        run: python -m pip install -r tools/okf/requirements.txt
      - name: Run validator fixtures
        run: python -m unittest tools.okf.tests.test_validate_cli
      - name: Enforce SmartDCA OKF conformance
        run: python tools/okf/validate.py . --strict
