name: Sync authoritative archive

on:
  push:
    branches:
      - agent/sync-authoritative-knowledge
    paths:
      - .github/workflows/sync-authoritative-archive.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-authoritative-knowledge
          fetch-depth: 0
      - name: Replace repository tree from authoritative archive
        shell: bash
        run: |
          set -euo pipefail
          archive="SmartDCA-Research-main.zip"
          if [ ! -f "$archive" ]; then
            exit 0
          fi

          tmp="$(mktemp -d)"
          unzip -q "$archive" -d "$tmp"
          src="$tmp/SmartDCA-Research-main"
          test -d "$src"

          # GITHUB_TOKEN cannot modify workflow files in this repository. Preserve
          # them during the bulk sync; the GitHub app will reconcile them afterward.
          mkdir -p "$tmp/preserved"
          cp -a .github/workflows "$tmp/preserved/workflows"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$src"/. .
          rm -rf .github/workflows
          mkdir -p .github
          cp -a "$tmp/preserved/workflows" .github/workflows

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Sync repository to authoritative knowledge snapshot"
          git push origin HEAD:agent/sync-authoritative-knowledge
